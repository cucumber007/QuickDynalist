apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.objectbox'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def releaseSigningPropertyNames = [
        'quickerdynalist.signing.storeFile',
        'quickerdynalist.signing.storePassword',
        'quickerdynalist.signing.keyAlias',
        'quickerdynalist.signing.keyPassword',
]
def missingReleaseSigningProperties = releaseSigningPropertyNames.findAll {
    !localProperties.getProperty(it)
}
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.louiskirsch.quickdynalist"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 55
        versionName "2.10.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (missingReleaseSigningProperties.isEmpty()) {
                storeFile file(localProperties.getProperty('quickerdynalist.signing.storeFile'))
                storePassword localProperties.getProperty('quickerdynalist.signing.storePassword')
                keyAlias localProperties.getProperty('quickerdynalist.signing.keyAlias')
                keyPassword localProperties.getProperty('quickerdynalist.signing.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (missingReleaseSigningProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.louiskirsch.quickdynalist'
}

dependencies {
    def lifecycle_version = "2.0.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-alpha3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0-alpha03'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    // androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    // implementation 'org.jetbrains:annotations-java5:16.0.3'
    implementation 'com.birbit:android-priority-jobqueue:2.0.1'
    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.google.android.material:material:1.1.0-alpha02'
    implementation "io.objectbox:objectbox-kotlin:$objectboxVersion"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.preference:preference:1.0.0"
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.timediv:jlatexmath-android:e661bda'
    implementation 'ru.noties:jlatexmath-android-font-cyrillic:0.1.0'
    implementation 'ru.noties:jlatexmath-android-font-greek:0.1.0'
    implementation project(':hashkode')
}

configurations {
    cleanedAnnotations
    compile.exclude group: 'org.jetbrains', module: 'annotations'
}

repositories {
    mavenCentral()
    jcenter()
}

if (releaseBuildRequested && !missingReleaseSigningProperties.isEmpty()) {
    throw new GradleException("Missing release signing values in local.properties: ${missingReleaseSigningProperties.join(', ')}")
}
